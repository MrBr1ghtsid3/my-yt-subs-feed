name: YouTube feed

on:
  schedule:
    # Every 3 hours at minute 17, UTC. GitHub often starts scheduled runs
    # 10-60 minutes late, and off-the-hour minutes are delayed less.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: yt-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit state.json back
    steps:
      - uses: actions/checkout@v5

      - name: Build feed and page
        run: python3 yt_digest.py run

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "Update feed state"
            git pull --rebase
            git push
          fi

      - name: Collect site files
        run: |
          mkdir -p _site
          cp output/index.html output/feed.xml _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this run is allowed to publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
