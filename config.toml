# yt-digest settings. Every key is optional; defaults are shown.

# Address of the published GitHub Pages site. Used for the feed's own
# address (rel="self") and the feed link on the page. Change it if your
# GitHub user name or repo name changes.
site_url = "https://mrbr1ghtsid3.github.io/my-yt-subs-feed/"

# Times on the page and in the feed are shown in this zone (IANA name).
# "Europe/Sofia" for Bulgarian time.
timezone = "Europe/London"

# Summary length in characters (cut at a sentence end where possible).
summary_max_chars = 280

# Leave out Shorts and past livestreams.
videos_only = true

# First run only: how far back to look for the local text digest. After
# that the digest covers everything since the previous run.
lookback_hours = 48

# How long seen videos are remembered and kept on the page and in the feed.
retain_days = 30

channels_file = "channels.txt"
state_file = "state.json"
page_file = "output/index.html"
feed_file = "output/feed.xml"
digest_file = "output/digest.txt"
feed_title = "YouTube subscriptions (text only)"
feed_max_items = 300
workers = 6
